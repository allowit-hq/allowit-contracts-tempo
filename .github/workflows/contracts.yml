name: Tempo contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tempo-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deployment-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:deployment
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: lock
        run: echo "foundry=v$(jq -er .foundryVersion dependencies.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: ${{ steps.lock.outputs.foundry }}
      - run: scripts/build.sh
      - run: forge fmt --check
      - run: forge test --network tempo --fuzz-runs 512 --no-match-path test/TempoNative.t.sol
