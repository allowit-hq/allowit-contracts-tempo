name: Tempo runtime smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full integration regression suite
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tempo-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: lock
        run: echo "foundry=v$(jq -er .foundryVersion dependencies.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: ${{ steps.lock.outputs.foundry }}
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install pinned dependencies and build
        run: scripts/build.sh
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
      - name: Smoke native TIP20 fund, transfer and recovery
        shell: bash
        run: |
          set -euo pipefail
          forge test --network tempo --match-path test/TempoNative.t.sol --match-test '^testRealTIP20FactoryFundExecuteMemoAndOwnerRecovery\(\)$' 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -F "1 tests passed" "$RUNNER_TEMP/smoke.log"
      - name: Full native Tempo regressions
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: forge test --network tempo --match-path test/TempoNative.t.sol
