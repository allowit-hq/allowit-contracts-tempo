[package]
name = "allowit-tempo"
version.workspace = true
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[features]
default = []
client = ["dep:allowit-sdk", "dep:libc", "dep:mpp", "dep:reqwest", "dep:zeroize", "dep:num-bigint", "dep:num-traits", "dep:time"]

[dependencies]
allowit-sdk = { workspace = true, features = ["client"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
url = "2"
libc = { version = "0.2.190", optional = true }
mpp = { version = "=0.15.0", default-features = false, optional = true }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "native-tls-vendored"], optional = true }
zeroize = { version = "1.8.2", optional = true }

num-bigint = { version = "0.4.6", optional = true }
num-traits = { version = "0.2.19", optional = true }
time = { version = "0.3", features = ["parsing"], optional = true }

[workspace]
members = ["services"]

# Every package in this repository builds at this version.
[workspace.package]
version = "0.1.0"

# The revision each git repository must be pinned to. scripts/build.sh checks
# every git dependency below against this table and fails on a stale pin.
[workspace.metadata.allowit.track]
allowit-core = "head"

[workspace.dependencies]
# Allowit core (package allowit-sdk) is the only git dependency.
allowit-sdk = { git = "https://github.com/allowit-hq/allowit-core.git", rev = "e68ad4be5e4d1c28b8435982a2a208d2f872ba4e", default-features = false }
